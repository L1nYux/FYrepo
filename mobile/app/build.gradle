plugins { id 'com.android.application' }

android {
    namespace 'org.fyrepo.zhiyu.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'org.fyrepo.zhiyu.mobile'
        minSdk 26
        targetSdk 35
        versionCode 10004402
        versionName '0.4.4-mobile.2'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('ZHIYU_KEYSTORE')) {
                storeFile file(System.getenv('ZHIYU_KEYSTORE'))
                storePassword System.getenv('ZHIYU_SIGNING_PASSWORD')
                keyAlias 'zhiyu-mobile'
                keyPassword System.getenv('ZHIYU_SIGNING_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ZHIYU_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Ship interface components in the APK. Server requests carry business data.
def phoneAssetOutput = layout.buildDirectory.dir('generated/phone-assets')
tasks.register('bundlePhoneComponents', Sync) {
    from('../../static') {
        include 'core/*.css', 'core/*.js', 'core/*.json', 'core/*.svg'
        include 'aihub/*.css', 'aihub/*.js'
        include 'vendor/emoji-mart/**'
    }
    into phoneAssetOutput.map { it.dir('static') }
}
android.sourceSets.main.assets.srcDir(phoneAssetOutput)
tasks.named('preBuild').configure { dependsOn 'bundlePhoneComponents' }
