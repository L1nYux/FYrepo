# Put limit_req_zone in nginx's http context; this example is normally included there.
limit_req_zone $binary_remote_addr zone=workbench_login:1m rate=10r/m;
server {
    listen 80;
    server_name team.example.com;
    client_max_body_size 64m;
    access_log off;
    location /desktop/api/ {
        limit_req zone=workbench_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# For production HTTPS, add a valid certificate using the existing server/domain
# configuration; then set WORKBENCH_HTTPS=1 and WORKBENCH_TRUST_PROXY=1.
# Keep TLS verification enabled in the client. Do not open port 8000 publicly.
