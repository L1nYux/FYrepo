<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'"><title>网页浏览器</title><link rel="stylesheet" href="browser.css"></head><body><header><form id="address-form"><button type="button" data-action="back" aria-label="后退" title="后退">←</button><button type="button" data-action="forward" aria-label="前进" title="前进">→</button><button type="button" data-action="reload" aria-label="刷新" title="刷新">↻</button><input id="address" type="text" maxlength="3000" autocomplete="off" spellcheck="false" aria-label="网页地址"><button type="submit" title="打开地址">打开</button><button type="button" data-action="dock" title="回到工作台侧栏">停靠</button><button type="button" data-action="external" title="在系统浏览器打开">↗</button><button type="button" data-action="close" aria-label="关闭浏览器，返回聊天" title="关闭浏览器">×</button></form><div class="reader-status"><span id="page-title">网页浏览器</span><span id="error" role="status"></span><button type="button" data-action="toggle-composer" aria-pressed="false" title="隐藏或显示 AI 聊天输入框">隐藏输入</button><button type="button" data-action="zoom-out" title="缩小">−</button><button type="button" data-action="zoom-reset" id="zoom" title="恢复默认缩放">100%</button><button type="button" data-action="zoom-in" title="放大">＋</button></div></header><script src="browser.js"></script></body></html>
