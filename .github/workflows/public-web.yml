name: Public web connection
on:
  workflow_dispatch:
  push:
    paths: ['aihub/web_tools.py', 'tools/check_public_web.py', '.github/workflows/public-web.yml']
permissions:
  contents: read
jobs:
  public-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/check_public_web.py
