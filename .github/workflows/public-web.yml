name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-76a41742d502c440847211e02062d04263509eb3
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76a41742d502c440847211e02062d04263509eb3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile unsigned APK
        working-directory: mobile
        run: gradle --no-daemon --console plain :app:assembleRelease
      - name: Align package for local signing
        run: |
          mkdir -p mobile/dist
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 mobile/app/build/outputs/apk/release/app-release-unsigned.apk mobile/dist/Zhiyu-0.4.4-mobile.2-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mobile/dist/*.apk > mobile/dist/package.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" mobile/dist/apksigner.jar
          cd mobile/dist
          sha256sum *.apk apksigner.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Zhiyu-Android-0.4.4-mobile.2
          path: mobile/dist/*
          if-no-files-found: error
