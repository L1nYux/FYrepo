{% extends 'core/base.html' %}{% block content %}<div class="heading"><div><a class="back" href="{% url 'finance_list' %}">← 返回财务</a><h1>{% if entry %}编辑财务记录{% else %}新增财务记录{% endif %}</h1></div></div><section class="card form-card"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}{% if entry.receipt %}<p>现有凭证：<a href="{% url 'finance_receipt' entry.pk %}">{{ entry.receipt_name }}</a>。上传新文件可替换当前凭证，旧文件仍留在私有目录并记录路径。</p>{% endif %}<p class="muted">凭证支持 TXT、PDF、Word、Excel，单文件不超过 20 MB。</p><button class="button primary" type="submit">保存记录</button></form></section>{% endblock %}
