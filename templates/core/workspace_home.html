{% extends 'core/base.html' %}{% block content %}<div class="heading"><div><h1>公告栏</h1><p class="muted">团队通知与工作安排</p></div>{% if is_admin %}<a class="button primary" href="{% url 'announcement_new' %}">发布公告</a>{% endif %}</div>{% for item in announcements %}<section class="card"><h2>{{ item.title }}</h2><small>{{ item.created_at|date:'Y-m-d' }}</small>{{ item.body|linebreaks }}{% if is_admin %}<a href="{% url 'announcement_edit' item.pk %}">编辑</a>{% endif %}</section>{% empty %}<section class="card"><p>暂无公告。</p></section>{% endfor %}<p><a class="button" href="{% url 'dashboard' %}">进入项目管理</a></p>{% endblock %}
