<form class="ownership-filter" method="get"><label>{{ owner_label|default:'归属' }}<select name="ownership" onchange="this.form.requestSubmit()">{% for space in resource_spaces %}<option value="{{ space.pk }}" {% if space.pk == current_workspace.pk %}selected{% endif %}>{{ space.name }}</option>{% endfor %}</select></label></form><p class="muted">当前归属：<strong>{{ current_workspace.name }}</strong> · 数据与额度按归属独立保存</p>
