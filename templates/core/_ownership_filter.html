<form class="ownership-filter" method="get"><label>归属 <select name="ownership" onchange="this.form.requestSubmit()"><option value="all">全部</option>{% for space in resource_spaces %}<option value="{{ space.pk }}" {% if resource_ownership == space.pk|stringformat:'s' %}selected{% endif %}>{{ space.name }}</option>{% endfor %}</select></label>{% if request.GET.q %}<input type="hidden" name="q" value="{{ request.GET.q }}">{% endif %}{% if request.GET.scope %}<input type="hidden" name="scope" value="{{ request.GET.scope }}">{% endif %}</form>
