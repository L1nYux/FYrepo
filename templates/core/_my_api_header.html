<div class="heading"><div><h1>我的 API</h1><p class="muted">{% if api_tab == 'connections' %}配置个人模型服务。团队连接由团队授权的管理员维护。{% else %}查看额度与调用记录，生成自己的调用 Key。{% endif %}</p></div>{% if api_tab == 'usage' %}<a class="button" href="#my-api-key" data-open-api-key>我的 API Key</a>{% endif %}</div>
<nav class="content-tabs" aria-label="我的 API"><a href="{% url 'me_api' %}" {% if api_tab == 'usage' %}aria-current="page"{% endif %}>用量与额度</a><a href="{% url 'me_api' %}?tab=connections" {% if api_tab == 'connections' %}aria-current="page"{% endif %}>连接与模型</a></nav>
{% if api_tab == 'usage' %}<form method="get" class="pool-filter"><label>额度来源 <select name="funding">{% for space in api_funding_choices %}<option value="{{ space.pk }}" {% if space.pk == current_workspace.pk %}selected{% endif %}>{{ space.name }}</option>{% endfor %}</select></label><button class="button">查看</button></form>{% endif %}
