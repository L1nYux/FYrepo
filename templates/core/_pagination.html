{% if page.has_other_pages %}<nav class="pagination" aria-label="分页">{% if page.has_previous %}<a class="button" href="?{{ page.query_string }}&amp;{{ page.page_key }}={{ page.previous_page_number }}">上一页</a>{% endif %}<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页 · {{ page.paginator.count }} 条</span>{% if page.has_next %}<a class="button" href="?{{ page.query_string }}&amp;{{ page.page_key }}={{ page.next_page_number }}">下一页</a>{% endif %}</nav>{% endif %}
