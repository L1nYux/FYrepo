<section class="resource-picker-page" data-reference-picker hidden aria-labelledby="reference-picker-title" data-search-url="{% url 'chat_reference_search' %}">
<header class="resource-picker-header"><button type="button" class="icon-button" data-reference-close aria-label="返回聊天">‹</button><h2 id="reference-picker-title">选择内容</h2><span data-reference-count></span></header>
<nav class="reference-kind-tabs" aria-label="引用类型"><button type="button" data-reference-kind="project">项目</button><button type="button" data-reference-kind="task">任务</button><button type="button" data-reference-kind="document">文档</button><button type="button" data-reference-kind="experiment">实验</button><button type="button" data-reference-kind="finance">财务</button><button type="button" data-reference-kind="announcement">公告</button></nav>
<div class="resource-picker-search"><input type="search" data-reference-search aria-label="搜索引用内容" placeholder="搜索名称或编号…" maxlength="100" autocomplete="off"></div>
<div class="reference-search-results" data-reference-results aria-live="polite"></div>
<p class="resource-picker-note muted">选择后添加到消息，最多 5 条。</p></section>
