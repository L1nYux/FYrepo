<dialog class="point-gift-dialog" data-gift-send-dialog aria-labelledby="gift-send-title"><div class="section-head"><h2 id="gift-send-title">发送积分</h2><button class="button compact" type="button" data-gift-close aria-label="关闭">×</button></div><p class="muted">可转赠额外点数：<strong data-gift-available>正在读取…</strong>。每周基础额度不能转赠。</p><form data-gift-form><label>类型<select name="kind"><option value="packet">积分红包</option>{% if peer %}<option value="transfer">积分转账</option>{% endif %}</select></label><label>总点数<input name="points" type="number" min="0.000001" max="1000000000" step="0.000001" inputmode="decimal" required placeholder="输入赠送点数"></label><div class="gift-group-fields" {% if peer %}hidden{% endif %}><label>红包类型<select name="mode"><option value="random">拼手气</option><option value="equal">均分</option></select></label><label>份数<input name="count" type="number" min="1" max="100" value="{% if peer %}1{% else %}3{% endif %}" inputmode="numeric"></label></div><label>祝福或备注<input name="greeting" maxlength="80" placeholder="科研顺利！"></label><p class="muted">发送时扣除额度，领取后计入对方的额外点数。24 小时未领取的部分会退回。</p><p data-gift-send-error class="error" role="alert"></p><button class="button primary" type="submit">确认发送</button></form><details class="gift-wallet-history"><summary>我的转赠与领取记录</summary><div data-gift-wallet-history></div></details></dialog>
<dialog class="point-gift-dialog gift-detail-dialog" data-gift-detail-dialog aria-labelledby="gift-detail-title"><div class="section-head"><h2 id="gift-detail-title">积分红包</h2><button class="button compact" type="button" data-gift-close aria-label="关闭">×</button></div><div data-gift-detail></div><p data-gift-detail-error class="error" role="alert"></p><button class="button primary" type="button" data-gift-claim hidden>领取红包</button><button class="button" type="button" data-gift-refund hidden>退回未领取转账</button></dialog>
