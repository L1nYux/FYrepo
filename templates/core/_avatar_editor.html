<section class="avatar-editor" data-avatar-editor aria-labelledby="avatar-heading"><h3 id="avatar-heading">头像</h3><div class="avatar-preview-row">{% include 'core/_avatar.html' with avatar_user=user %}<img data-avatar-preview alt="新头像预览" hidden></div><p class="muted">支持 PNG、JPG、WebP，最大 5 MB。选择后可拖动、缩放与旋转，自由裁剪头像。开启公开成员资料后，头像也会随资料公开。</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<input type="hidden" name="action" value="avatar">{{ avatar_form.as_p }}<p class="muted" data-avatar-hint role="status"></p><button class="button primary" type="submit">保存头像</button></form>{% if user.member_profile.avatar %}<form method="post">{% csrf_token %}<input type="hidden" name="action" value="avatar_remove"><button class="button" type="submit">恢复默认头像</button></form>{% endif %}</section>
