{% load avatars %}{% avatar_url avatar_user as image_url %}<span class="{{ avatar_class|default:'account-avatar' }} user-avatar" data-user-avatar {% if user.is_authenticated and not avatar_static %}data-member-id="{{ avatar_user.pk }}" role="button" tabindex="0" aria-label="查看 {{ avatar_user|nickname }} 的资料"{% endif %}><span data-avatar-initial>{{ avatar_user|nickname|slice:':1'|upper }}</span>{% if image_url %}<img src="{{ image_url }}" alt="" decoding="async" data-avatar-image>{% endif %}</span>
