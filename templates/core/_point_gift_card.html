{% load avatars %}{% if gift %}<button type="button" class="point-gift-card {{ gift.kind }}" data-gift-id="{{ gift.id }}" data-gift-status="{{ gift.status }}" data-gift-dimmed="{{ gift.dimmed|yesno:'true,false' }}"><span class="point-gift-icon" aria-hidden="true">{% if gift.kind == 'transfer' %}⇄{% else %}福{% endif %}</span><span><strong>{% if gift.kind == 'transfer' %}{{ gift.points|point_display }} 点{% else %}{{ gift.greeting }}{% endif %}</strong><small>{% if gift.kind == 'transfer' %}{{ gift.state_label }}{% elif gift.claimed_points %}已领取 {{ gift.claimed_points|point_display }} 点{% else %}{{ gift.status }}{% endif %}</small></span><span class="point-gift-footer">{{ gift.title }} · {% if gift.mode == 'random' %}拼手气{% else %}额外点数{% endif %}</span></button>{% endif %}
