<div class="conversation-tools"><span class="muted" data-current-muted {% if not conversation_muted %}hidden{% endif %}>消息免打扰</span><details data-conversation-menu><summary class="button compact" aria-label="聊天设置与记录">⋯</summary><div class="conversation-tools-menu">{% if show_legacy %}<a href="{% url 'messages_hub' %}?room=public&amp;space={{ current_workspace.pk }}">历史公共聊天室（只读）</a>{% endif %}<button type="button" data-conversation-action="search">查找聊天记录</button><button type="button" data-conversation-action="mute" aria-pressed="{% if conversation_muted %}true{% else %}false{% endif %}">{% if conversation_muted %}关闭消息免打扰{% else %}开启消息免打扰{% endif %}</button><button type="button" data-conversation-action="clear">清空我的聊天记录</button><button type="button" data-conversation-action="remove">从列表移除会话</button></div></details></div>
