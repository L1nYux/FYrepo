{% load avatars %}{% if parameter_templates %}<details class="card record-tools"><summary>参数模板</summary>{% for preset in parameter_templates %}<div class="template-management-row"><div><strong>{{ preset.name }}</strong><small>{{ preset.created_by|nickname }} · {{ preset.parameters|length }} 项参数</small></div>{% if is_admin or preset.created_by_id == user.pk %}<form method="post" action="{% url 'experiment_template_delete' preset.pk %}" onsubmit="return confirm('删除模板？已保存的实验记录不受影响。')">{% csrf_token %}<button class="shell-tool danger-text">删除</button></form>{% endif %}</div>{% endfor %}</details>{% endif %}
