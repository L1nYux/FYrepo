<dialog class="history-dialog" data-history-dialog aria-labelledby="history-heading"><div class="section-head"><h2 id="history-heading">查找聊天记录</h2><button class="button compact" type="button" data-history-close aria-label="关闭查找">×</button></div><form data-history-form><label>关键词<input name="q" type="search" maxlength="100" placeholder="消息或文件名"></label><div class="history-filters"><label>开始日期<input name="start" type="date"></label><label>结束日期<input name="end" type="date"></label><label>发送人<select name="author"><option value="">所有人</option>{% for author in history_authors %}<option value="{{ author.pk }}">{{ author.username }}</option>{% endfor %}</select></label><label>内容类型<select name="kind"><option value="">全部</option><option value="image">图片</option><option value="file">文件</option><option value="reference">引用</option></select></label></div><button class="button primary" type="submit">查找</button></form><p class="muted" data-history-status role="status">查找当前聊天中自己可见的记录。</p><div class="history-results" data-history-results></div><button class="button" type="button" data-history-more hidden>查看更多结果</button></dialog>
<div class="conversation-history-controls"><button class="button compact" type="button" data-conversation-older {% if not has_older %}hidden{% endif %}>查看更早消息</button><button class="button compact" type="button" data-conversation-latest hidden>回到最新消息</button></div>
