{% if not project and not item and not origin_project and not origin_task %}<label class="creation-owner">归属<select name="ownership" data-creation-owner>{% for space in creation_spaces %}<option value="{{ space.pk }}" {% if space.pk == current_workspace.pk %}selected{% endif %}>{{ space.name }}</option>{% endfor %}</select></label><small>内容将保存在所选归属中，并按对应权限操作。</small>{% else %}<p class="muted">归属：{{ current_workspace.name }}</p>{% endif %}
