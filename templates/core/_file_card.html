<a class="message-file file-card" href="{{ file.preview_url|default:file.url }}" data-download-url="{{ file.url }}" data-file-name="{{ file.name }}"><span class="file-card-copy"><strong>{{ file.name }}</strong><small>{% if file.size != None %}{{ file.size|filesizeformat }} · {% endif %}{{ file.type|default:'文件' }}</small></span><span class="file-type-icon" aria-hidden="true">{{ file.type|default:'FILE' }}</span></a>
