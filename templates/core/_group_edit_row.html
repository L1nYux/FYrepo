<form class="group-edit-row" method="post" action="{% url 'group_manage' group.pk %}" data-group-form {% if editable %}data-inline-edit{% endif %} data-empty="{{ empty|default:'未设置' }}">{% csrf_token %}<input type="hidden" name="action" value="{{ action }}"><h3>{{ title }}</h3><div class="group-edit-display"><span data-edit-value>{% firstof value empty '未设置' %}</span>{% if editable %}<button type="button" class="icon-button" data-edit-start aria-label="编辑{{ title }}">✎</button>{% endif %}</div>{% if editable %}{% if multiline %}<textarea data-edit-input name="{{ field }}" maxlength="{{ limit }}" rows="6" hidden>{{ value }}</textarea>{% else %}<input data-edit-input name="{{ field }}" value="{{ value }}" maxlength="{{ limit }}" {% if field == 'name' %}required{% endif %} hidden>{% endif %}{% endif %}</form>
