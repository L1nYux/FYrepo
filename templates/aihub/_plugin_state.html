<span class="plugin-state" data-plugin-state data-enabled="{{ plugin.enabled|yesno:'true,false' }}">{% if not plugin.available %}仅电脑版{% elif plugin.enabled %}已启用{% else %}未启用{% endif %}</span><button type="button" class="button compact{% if plugin.available and not plugin.enabled %} primary{% endif %}" data-plugin-toggle {% if plugin.runtime == 'server' %}data-url="{% url 'plugin_setting' plugin.id %}"{% endif %} aria-pressed="{{ plugin.enabled|yesno:'true,false' }}" aria-label="{% if plugin.enabled %}停用{% else %}启用{% endif %}{{ plugin.label }}" {% if not plugin.available %}disabled{% endif %}>{% if not plugin.available %}电脑版配置{% elif plugin.enabled %}停用{% else %}启用{% endif %}</button>
