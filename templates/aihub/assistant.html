{% extends 'core/base.html' %}{% load static %}{% block content %}
<section class="assistant-layout" id="assistant-app" data-catalog="{% url 'api_catalog' %}" data-start="{% url 'ai_start' %}" data-conversations="{% url 'ai_conversations' %}" data-conversation-base="/assistant/conversations/" data-job-base="/assistant/jobs/" data-references="{% url 'ai_references' %}" data-user="{{ user.pk }}" data-context-kind="{{ context_kind }}" data-context-id="{{ context_id }}">
<aside class="assistant-sidebar" aria-label="AI 对话导航"><div class="assistant-sidebar-top"><strong>AI 助手</strong><button type="button" class="icon-button" id="assistant-sidebar-close" aria-label="收起对话侧栏">☷</button></div><button type="button" class="assistant-new-chat" id="assistant-new">＋ 新建对话</button><input type="search" id="assistant-conversation-search" placeholder="搜索对话" aria-label="搜索自己的 AI 对话"><div class="assistant-sidebar-label">最近对话</div><nav id="assistant-conversations" class="assistant-conversations" aria-label="历史对话"><p class="muted">正在加载…</p></nav></aside>
<div class="assistant-app">
<header class="assistant-heading"><button type="button" class="icon-button" id="assistant-sidebar-toggle" aria-label="展开或收起对话侧栏" aria-expanded="true">☷</button><div><h1 id="assistant-title">新对话</h1><p class="muted">结合你的工作资料，查找、总结和起草。</p></div></header>
<div class="assistant-thread" id="assistant-thread" aria-live="polite"><div class="assistant-empty" id="assistant-empty"><h2>从一个问题开始</h2><p>问问今天的待办、项目进展，或引用一份资料让助手整理。</p><div class="assistant-suggestions"><button type="button" data-assistant-prompt="看看我的未完成任务和最新公告，今天优先做什么？">今天先做什么？</button><button type="button" data-assistant-prompt="请读取我引用的资料，总结目前的进展、问题和下一步。">整理项目进展</button><button type="button" data-assistant-prompt="根据我引用的实验与任务记录，起草一份简短的成果说明。">起草成果说明</button></div></div></div>
<form id="assistant-form" class="assistant-composer">{% csrf_token %}<div id="assistant-context" class="assistant-context" hidden><span></span><button type="button" id="assistant-clear-context" aria-label="移除引用">×</button></div><textarea id="assistant-input" rows="3" maxlength="30000" placeholder="描述你想解决的问题…" required></textarea><div class="assistant-composer-footer"><button type="button" class="button" id="assistant-add" aria-label="引用工作台资料">＋ 引用</button><select id="assistant-model" aria-label="选择模型"><option>加载模型…</option></select><span class="muted" id="assistant-status">调用计入你的团队 API 池用量</span><button type="button" class="button" id="assistant-stop" hidden>停止</button><button type="submit" class="button primary" id="assistant-send">发送</button></div></form><p class="assistant-footnote">读取沿用你的账户权限，私聊仅限本人参与的会话。助手提供建议与草稿，正式操作由你提交。</p>
<dialog id="assistant-reference-dialog" class="assistant-reference-dialog"><div class="section-head"><h2>引用资料</h2><button type="button" class="button" id="assistant-reference-close">关闭</button></div><div class="pool-filter"><select id="assistant-reference-kind"><option value="task">任务</option><option value="project">项目</option><option value="experiment">实验</option><option value="announcement">公告</option><option value="message">聊天</option><option value="entry">账目</option><option value="claim">报销</option></select><input id="assistant-reference-query" type="search" placeholder="搜索标题或内容…"></div><div id="assistant-reference-results"></div></dialog>

</div>
<dialog id="assistant-rename-dialog" class="assistant-rename-dialog"><form id="assistant-rename-form"><h2>重命名对话</h2><input id="assistant-rename-title" maxlength="100" required aria-label="对话名称"><p id="assistant-rename-error" class="danger-text" role="alert"></p><div class="btn-row"><button type="button" class="button" id="assistant-rename-close">取消</button><button type="submit" class="button primary">保存</button></div></form></dialog>
</section><script src="{% static 'aihub/assistant.js' %}" defer></script>
{% endblock %}
